<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPS Autisti</title>

    <!-- Icone + PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1976d2">

    <!-- Stile CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:active {
            background-color: #115293;
        }
        h1 {
            margin-bottom: 30px;
            text-align: center;
            color: #1976d2;
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #1976d2;
            display: none;
        }
    </style>
</head>
<body>
    <h1>📍 Attiva il GPS</h1>
    <button onclick="getLocation()">Avvia GPS</button>

    <div id="status">⏳ Recupero posizione…</div>

    <script>
        const APP_URL = "https://gestione-code-realtime.onrender.com"; // <-- QUI ORA È CORRETTO

        function getLocation() {
            const status = document.getElementById("status");
            status.style.display = "block";
            status.textContent = "⏳ Recupero posizione…";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, error, {
                    enableHighAccuracy: true
                });
            } else {
                alert("Geolocalizzazione non supportata dal browser.");
            }
        }

        function success(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            const url = `${APP_URL}?lat=${lat}&lon=${lon}`;
            window.location.href = url;
        }

        function error(err) {
            const status = document.getElementById("status");
            status.style.display = "none";

            if (err.code === err.PERMISSION_DENIED) {
                alert("Permesso GPS negato. Devi abilitarlo per continuare.");
            } else {
                alert("Errore posizione: " + err.message);
            }
        }

        // PWA Service Worker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .register("service-worker.js")
                .catch(err => console.log("SW error:", err));
        }
    </script>
</body>
</html>
