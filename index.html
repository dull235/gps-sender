<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP Autisti</title>

    <!-- Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1976d2">

    <!-- Stile CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:active {
            background-color: #115293;
        }
        h1 {
            margin-bottom: 30px;
            text-align: center;
            color: #1976d2;
        }
    </style>
</head>
<body>
    <h1>Benvenuto</h1>
    <button onclick="getLocation()">ENTRA</button>

    <script>
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, error);
            } else {
                alert("Geolocalizzazione non supportata dal browser.");
            }
        }

        function success(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            // Link alla tua app su Render
            const renderLink = "https://gestione-code-realtime.onrender.com";

            // Reindirizza con lat/lon
            window.location.href = `${renderLink}?lat=${lat}&lon=${lon}`;
        }

        function error(err) {
            if (err.code === err.PERMISSION_DENIED) {
                alert("Permesso GPS negato. Consenti la posizione per continuare.");
            } else {
                alert("Errore rilevamento posizione: " + err.message);
            }
        }

        // Service Worker
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js")
                .then(() => console.log("Service Worker registrato"))
                .catch(err => console.error("Errore SW:", err));
        }
    </script>
</body>
</html>
