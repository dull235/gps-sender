<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>GPS Sender</title>
  </head>
  <body style="font-family:sans-serif; text-align:center; padding:2em;">
    <h3>📍 Attiva la tua posizione GPS</h3>
    <button onclick="getLocation()">Avvia</button>
    <p id="status"></p>

    <script>
      function getLocation() {
        document.getElementById("status").innerText = "Richiesta posizione...";
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(success, error);
        } else {
          document.getElementById("status").innerText = "Geolocalizzazione non supportata.";
        }
      }

      function success(pos) {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const url = "https://TUO-APP-STREAMLIT.streamlit.app/?lat=" + lat + "&lon=" + lon;
        window.location.href = url;
      }

      function error(err) {
        document.getElementById("status").innerText = "Errore GPS: " + err.message;
      }
    </script>
  </body>
</html>
