<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPS Autisti</title>

    <!-- Icona PWA -->
    <link rel="icon" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />

    <link rel="manifest" href="manifest.json">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1565c0;
            margin-bottom: 10px;
        }

        p {
            color: #444;
        }

        button {
            padding: 15px 28px;
            font-size: 18px;
            background: #1976d2;
            color: white;
            border: none;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:active {
            background: #0e4f91;
        }

        #loader {
            display: none;
            margin-top: 20px;
            font-size: 16px;
            color: #1976d2;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>📍 GPS Autisti</h1>
        <p>Premi il pulsante per attivare la posizione e accedere all'app.</p>
        
        <button onclick="avviaGPS()">Attiva GPS</button>

        <div id="loader">🔄 GPS attivo… sto aprendo l'app</div>
    </div>

    <script>
        const APP_URL = "https://gestione-code-realtime.onrender.com";

        function avviaGPS() {
            if (!navigator.geolocation) {
                alert("Il tuo dispositivo non supporta la geolocalizzazione.");
                return;
            }

            document.getElementById("loader").style.display = "block";

            navigator.geolocation.getCurrentPosition(
                pos => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;

                    window.location.href = `${APP_URL}?lat=${lat}&lon=${lon}`;
                },

                err => {
                    document.getElementById("loader").style.display = "none";

                    if (err.code === err.PERMISSION_DENIED)
                        alert("⚠️ Devi concedere il permesso di accesso alla posizione.");
                    else
                        alert("Errore GPS: " + err.message);
                },

                { enableHighAccuracy: true }
            );
        }

        // Registro Service Worker PWA
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .register("service-worker.js")
                .catch(err => console.error("SW error:", err));
        }
    </script>

</body>
</html>
